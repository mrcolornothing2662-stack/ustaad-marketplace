<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ustaad Partner — Worker App</title>
<meta name="description" content="Ustaad worker app prototype — manage services, prices, requests and jobs. Interactive frontend prototype.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2319483D'/%3E%3Ctext x='32' y='44' font-family='Arial' font-size='34' font-weight='bold' fill='white' text-anchor='middle'%3EU%3C/text%3E%3Ccircle cx='50' cy='50' r='7' fill='%236E9C88'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Ustaad Design System ============ */
:root{
  --forest:#19483D; --forest-2:#0F352C; --forest-soft:#24584A;
  --sage:#6E9C88; --sage-2:#8FB4A3; --pale:#E8EEE7; --pale-2:#F0F4EE;
  --bg:#F7F6F1; --card:#FFFFFF; --line:#E5E9E2; --line-2:#EDF0EA;
  --text:#202B28; --mut:#737D78; --mut-2:#9AA39D;
  --ok:#238653; --ok-bg:#E3F2E9; --warn:#D99A37; --warn-bg:#FBF1DE; --err:#D9534F; --err-bg:#FBE7E6;
  --r-xl:22px; --r-lg:18px; --r-md:14px; --r-sm:11px;
  --sh:0 1px 2px rgba(25,72,61,.05),0 10px 28px rgba(25,72,61,.08);
  --sh-sm:0 1px 3px rgba(25,72,61,.10);
  --sh-pop:0 12px 40px rgba(15,53,44,.22);
  --ff:'Manrope','Inter',system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans','Noto Sans Devanagari',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:var(--ff);background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;min-height:100vh}
img{max-width:100%;display:block}
button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--text)}
a{color:var(--forest);text-decoration:none}
h1,h2,h3,h4{line-height:1.25;font-weight:800;letter-spacing:-.01em}
:focus-visible{outline:2.5px solid var(--sage);outline-offset:2px;border-radius:6px}
::selection{background:rgba(110,156,136,.3)}
.ic{width:22px;height:22px;flex:none;display:inline-block;vertical-align:-5px}
.ic.sm{width:17px;height:17px;vertical-align:-3.5px}
.ic.lg{width:26px;height:26px}
.ic.xs{width:14px;height:14px;vertical-align:-2px}

/* ---------- Shell layout ---------- */
.wrap{display:flex;min-height:100vh}
.sidebar{display:none}
.main-col{flex:1;min-width:0;display:flex;flex-direction:column}
.view{flex:1;width:100%;max-width:560px;margin:0 auto;padding:0 16px calc(92px + env(safe-area-inset-bottom))}
.view.wide{max-width:860px}
.view.flush{padding:0 0 calc(92px + env(safe-area-inset-bottom))}
.pagepad{padding-top:16px}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--card);border-top:1px solid var(--line-2);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(25,72,61,.06)}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--mut);padding:6px 10px;border-radius:12px;min-width:56px;min-height:48px;transition:color .15s}
.bottomnav button .ic{width:23px;height:23px}
.bottomnav button.on{color:var(--forest)}
.bottomnav button.on .navdot{opacity:1;transform:scale(1)}
.navdot{width:4px;height:4px;border-radius:99px;background:var(--forest);opacity:0;transform:scale(0);transition:.2s}
.navbadge{position:absolute;top:2px;right:calc(50% - 20px);min-width:16px;height:16px;border-radius:99px;background:var(--err);color:#fff;font-size:9.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 4px}
.bottomnav button{position:relative}
@media(min-width:960px){
  .sidebar{display:flex;flex-direction:column;width:248px;flex:none;position:sticky;top:0;height:100vh;background:var(--card);border-right:1px solid var(--line-2);padding:22px 14px 18px}
  .bottomnav{display:none}
  .view{max-width:640px;padding-bottom:48px}
  .view.wide{max-width:900px}
}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px}
.side-nav{display:flex;flex-direction:column;gap:4px}
.side-nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;font-weight:700;color:var(--mut);font-size:14.5px;text-align:left;transition:.15s}
.side-nav button:hover{background:var(--pale-2);color:var(--text)}
.side-nav button.on{background:var(--pale);color:var(--forest)}
.side-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--mut);display:flex;flex-direction:column;gap:10px}

/* ---------- Brand ---------- */
.brand{display:inline-flex;align-items:center;gap:9px;font-weight:800;font-size:19px;color:var(--forest);letter-spacing:-.02em}
.brand .mark{width:34px;height:34px;border-radius:11px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;position:relative;flex:none}
.brand .mark::after{content:"";position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:99px;background:var(--sage);border:2.5px solid var(--card)}
.brand.on-dark{color:#fff}
.brand.on-dark .mark::after{border-color:var(--forest)}

/* ---------- Cards / sections ---------- */
.card{background:var(--card);border-radius:var(--r-lg);box-shadow:var(--sh-sm);border:1px solid var(--line-2)}
.card.pd{padding:16px}
.card.pad-lg{padding:20px}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.sec-h h2{font-size:17.5px}
.sec-h .lnk{font-size:13px;font-weight:800;color:var(--forest);display:inline-flex;align-items:center;gap:2px;min-height:32px}
.sub{color:var(--mut);font-size:13.5px}
.lite{color:var(--mut);font-size:12.5px}
.tiny{font-size:11.5px;color:var(--mut-2)}
.divider{height:1px;background:var(--line-2);margin:14px 0}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:800;font-size:14.5px;border-radius:13px;padding:13px 20px;min-height:48px;transition:transform .12s,box-shadow .15s,background .15s,opacity .15s;user-select:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--forest);color:#fff;box-shadow:0 6px 16px rgba(25,72,61,.22)}
.btn.pri:hover{background:var(--forest-soft)}
.btn.sage{background:var(--sage);color:#fff}
.btn.soft{background:var(--pale);color:var(--forest)}
.btn.soft:hover{background:#DEE8DC}
.btn.out{border:1.5px solid var(--line);background:var(--card);color:var(--text)}
.btn.out:hover{border-color:var(--sage)}
.btn.ghost{color:var(--forest);min-height:44px;padding:8px 12px}
.btn.danger{background:var(--err-bg);color:var(--err)}
.btn.danger-o{border:1.5px solid rgba(217,83,79,.4);color:var(--err);background:var(--card)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:13px;border-radius:11px}
.btn.xs{min-height:32px;padding:5px 11px;font-size:12px;border-radius:9px;gap:5px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.btnrow{display:flex;gap:10px;margin-top:16px}
.btnrow .btn{flex:1}
.iconbtn{width:42px;height:42px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;color:var(--text);background:var(--card);border:1px solid var(--line-2);position:relative;flex:none;transition:.15s}
.iconbtn:hover{background:var(--pale-2)}
.iconbtn.plain{border:none;background:transparent}
.iconbtn .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:99px;background:var(--err);border:1.5px solid var(--card)}

/* ---------- Chips / badges ---------- */
.chiprow{display:flex;gap:8px;overflow-x:auto;padding:2px 16px 10px;margin:0 -16px;scrollbar-width:none}
.view>.chiprow,.chiprow.inview{padding-left:0;padding-right:0;margin:0}
.chiprow::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-weight:700;font-size:13px;padding:9px 14px;border-radius:99px;background:var(--card);border:1.5px solid var(--line-2);color:var(--text);min-height:38px;transition:.15s}
.chip .ic{width:17px;height:17px}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:3.5px 9px;border-radius:99px;background:var(--pale);color:var(--forest)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:#A9741F}
.badge.err{background:var(--err-bg);color:var(--err)}
.badge.sage{background:var(--pale);color:var(--forest)}
.badge.demo{background:#F3E8FB;color:#7A3EA1}
.vbadge{width:16px;height:16px;color:var(--sage);flex:none}
.stars-mini{display:inline-flex;align-items:center;gap:3px;font-weight:800;font-size:12.5px;color:var(--text)}
.stars-mini .ic{width:14px;height:14px;color:var(--warn);fill:var(--warn)}
.stars-mini .n{color:var(--mut);font-weight:700}

/* ---------- Forms ---------- */
.field{margin-bottom:15px}
.field>label{display:block;font-size:13px;font-weight:800;color:var(--text);margin-bottom:7px}
.field .hint{font-size:12px;color:var(--mut);margin-top:5px}
.input,.select,.textarea{width:100%;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:13px 15px;min-height:50px;transition:border .15s,box-shadow .15s}
.input:focus,.select:focus,.textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3.5px rgba(110,156,136,.16)}
.input.err{border-color:var(--err);box-shadow:0 0 0 3.5px rgba(217,83,79,.12)}
.textarea{min-height:96px;resize:vertical}
.inputwrap{position:relative}
.inputwrap .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mut-2);width:20px;height:20px}
.inputwrap .input{padding-left:44px}
.frow{display:flex;gap:10px}
.frow>*{flex:1;min-width:0}
.ferr{color:var(--err);font-size:12.5px;font-weight:700;margin-top:6px;display:flex;gap:5px;align-items:center}
.phonebox{display:flex;align-items:stretch;gap:0;background:var(--card);border:1.5px solid var(--line);border-radius:13px;overflow:hidden}
.phonebox:focus-within{border-color:var(--sage);box-shadow:0 0 0 3.5px rgba(110,156,136,.16)}
.phonebox .cc{display:flex;align-items:center;gap:6px;padding:0 12px 0 14px;font-weight:800;font-size:15px;border-right:1.5px solid var(--line);color:var(--text);background:var(--pale-2)}
.phonebox .input{border:none;border-radius:0;min-height:52px}
.phonebox .input:focus{box-shadow:none}
.checkline{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);padding:4px 0}
.checkline input[type=checkbox]{width:19px;height:19px;accent-color:var(--forest);margin-top:1px;flex:none}
.checkline b{color:var(--text)}
/* toggle */
.toggle{position:relative;width:52px;height:31px;flex:none;border-radius:99px;background:#D8DED6;transition:.2s;border:none}
.toggle::after{content:"";position:absolute;top:3.5px;left:4px;width:24px;height:24px;border-radius:99px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:.2s}
.toggle.on{background:var(--ok)}
.toggle.on::after{left:24px}
.togglerow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0}
.togglerow .tl{font-weight:700;font-size:14.5px}
.togglerow .ts{font-size:12.5px;color:var(--mut)}

/* ---------- Avatars ---------- */
.avatar{border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;letter-spacing:.02em;overflow:hidden;position:relative}
.avatar img{width:100%;height:100%;object-fit:cover}
.av-sm{width:38px;height:38px;font-size:13.5px}
.av-md{width:48px;height:48px;font-size:16px}
.av-lg{width:64px;height:64px;font-size:21px}
.av-xl{width:86px;height:86px;font-size:29px;border:3.5px solid #fff;box-shadow:var(--sh)}
.av-ring{box-shadow:0 0 0 2.5px var(--pale)}

/* ---------- App bar (per screen) ---------- */
.appbar{position:sticky;top:0;z-index:40;background:rgba(247,246,241,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;align-items:center;gap:10px;padding:12px 16px;margin:0 -16px 4px;border-bottom:1px solid transparent}
.appbar.bordered{border-bottom-color:var(--line-2)}
.appbar .grow{flex:1;min-width:0}
.appbar h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar.onforest{background:var(--forest);color:#fff;margin:0;padding:14px 16px}
.scr-title{font-size:22px;margin:14px 0 4px}
.scr-sub{color:var(--mut);font-size:13.5px;margin-bottom:16px}

/* ---------- Hero / home ---------- */
.hero{background:linear-gradient(150deg,var(--forest) 0%,var(--forest-2) 78%,#0C2C24 100%);border-radius:0 0 26px 26px;color:#fff;padding:18px 20px 58px;margin:0 -16px 0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border-radius:99px;background:radial-gradient(circle,rgba(110,156,136,.35),transparent 68%)}
.hero::before{content:"";position:absolute;right:30px;bottom:-90px;width:190px;height:190px;border-radius:99px;background:radial-gradient(circle,rgba(110,156,136,.22),transparent 70%)}
.hero h1{font-size:23px;margin:12px 0 6px;max-width:300px}
.hero p{font-size:13.5px;color:#CFE0D8;max-width:290px}
.hero .brandrow{display:flex;align-items:center;justify-content:space-between}
.searchbar{background:var(--card);border-radius:16px;box-shadow:var(--sh);display:flex;align-items:center;gap:10px;padding:6px 8px 6px 16px;position:relative;z-index:2;margin-top:-38px}
.searchbar .ic{color:var(--mut-2)}
.searchbar input{flex:1;border:none;outline:none;background:none;font-size:14.5px;font-weight:600;min-width:0;min-height:48px}
.searchbar .go{background:var(--forest);color:#fff;border-radius:12px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:none}
.sugg{position:absolute;top:calc(100% + 8px);left:0;right:0;background:var(--card);border-radius:16px;box-shadow:var(--sh-pop);border:1px solid var(--line-2);overflow:hidden;z-index:30;max-height:300px;overflow-y:auto}
.sugg button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:12px 15px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line-2)}
.sugg button:last-child{border-bottom:none}
.sugg button:hover{background:var(--pale-2)}
.sugg .sug-ic{width:34px;height:34px;border-radius:10px;background:var(--pale);color:var(--forest);display:flex;align-items:center;justify-content:center;flex:none}
.sugg .sug-ic .ic{width:18px;height:18px;color:var(--forest)}
.sugg small{display:block;color:var(--mut);font-weight:600;font-size:11.5px}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat-item{background:var(--card);border:1px solid var(--line-2);border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:13px 4px 11px;font-weight:700;font-size:11.5px;color:var(--text);text-align:center;transition:.15s;min-height:86px;justify-content:center}
.cat-item:hover{border-color:var(--sage);box-shadow:var(--sh-sm)}
.cat-item .ci{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.cat-item .ci .ic{width:21px;height:21px}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:2px 16px 8px;margin:0 -16px;scroll-snap-type:x mandatory;scrollbar-width:none}
.view>.hscroll{padding-left:0;padding-right:0;margin:0}
.hscroll::-webkit-scrollbar{display:none}
.hscroll>*{scroll-snap-align:start;flex:none}
.steps3{display:grid;gap:10px}
.steprow{display:flex;gap:13px;align-items:flex-start;background:var(--card);border:1px solid var(--line-2);border-radius:16px;padding:14px}
.steprow .n{width:30px;height:30px;border-radius:99px;background:var(--forest);color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;justify-content:center;flex:none}
.steprow b{display:block;font-size:14px}
.steprow p{font-size:12.5px;color:var(--mut)}
.feefree{display:flex;gap:12px;align-items:center;background:linear-gradient(120deg,var(--pale),#EEF3EA);border:1.5px dashed var(--sage);border-radius:var(--r-lg);padding:14px 16px}
.feefree .ic{color:var(--forest);width:26px;height:26px}
.feefree b{color:var(--forest);font-size:14px;display:block}
.feefree span{font-size:12.5px;color:var(--mut)}

/* ---------- Worker card ---------- */
.wcard{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:15px;display:flex;flex-direction:column;gap:11px;transition:.15s;cursor:pointer;position:relative}
.wcard:hover{box-shadow:var(--sh);border-color:#DCE4DA}
.wcard:active{transform:scale(.985)}
.wcard .top{display:flex;gap:12px;align-items:flex-start}
.wcard .nm{font-weight:800;font-size:15.5px;display:flex;align-items:center;gap:5px}
.wcard .skl{font-size:12.5px;color:var(--mut);font-weight:600}
.wcard .meta{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:12px;color:var(--mut);font-weight:600}
.wcard .meta span{display:inline-flex;align-items:center;gap:4px}
.wcard .meta .ic{width:13.5px;height:13.5px}
.wcard .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line-2);padding-top:11px}
.price-from{font-size:11.5px;color:var(--mut);font-weight:700}
.price-from b{font-size:16.5px;color:var(--forest);font-weight:800;margin-left:3px}
.avdot{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800}
.avdot i{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none}
.avdot.off i{background:var(--mut-2)}
.wcard.h{width:264px}
.grid-cards{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.grid-cards{grid-template-columns:1fr 1fr}}
@media(min-width:960px){.grid-cards{grid-template-columns:1fr 1fr 1fr}}
.favbtn{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:99px;background:var(--pale-2);display:flex;align-items:center;justify-content:center;color:var(--mut);z-index:2}
.favbtn.on{color:var(--err)}
.favbtn.on .ic{fill:var(--err)}

/* ---------- List rows ---------- */
.svc-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line-2)}
.svc-row:last-child{border-bottom:none}
.svc-row .si{width:42px;height:42px;border-radius:13px;background:var(--pale);color:var(--forest);display:flex;align-items:center;justify-content:center;flex:none}
.svc-row .st{flex:1;min-width:0}
.svc-row .st b{font-size:14.5px;display:block}
.svc-row .st span{font-size:12px;color:var(--mut)}
.svc-row .sp{text-align:right;flex:none}
.svc-row .sp b{font-size:15px;color:var(--forest)}
.svc-row .sp .tiny{display:block}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;background:none}
.list-row:last-child{border-bottom:none}
.list-row:hover{background:var(--pale-2)}
.list-row .lt{flex:1;min-width:0}
.list-row .lt b{display:block;font-size:14.5px}
.list-row .lt span{font-size:12.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-row .arr{color:var(--mut-2)}

/* ---------- Sheet / modal / toast ---------- */
.sheet-back{position:fixed;inset:0;background:rgba(15,40,33,.45);z-index:90;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.sheet-back.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;background:var(--card);border-radius:24px 24px 0 0;max-height:88vh;overflow-y:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(102%);transition:transform .28s cubic-bezier(.32,.72,.24,1);max-width:640px;margin:0 auto}
.sheet.show{transform:translateY(0)}
.sheet .grab{width:44px;height:5px;border-radius:99px;background:var(--line);margin:6px auto 14px}
.sheet h3{font-size:17.5px;margin-bottom:4px}
.sheet .sh-sub{color:var(--mut);font-size:13px;margin-bottom:16px}
@media(min-width:960px){.sheet{border-radius:24px;bottom:12%;padding-bottom:22px;border:1px solid var(--line-2);box-shadow:var(--sh-pop)}}
.modal-back{position:fixed;inset:0;background:rgba(15,40,33,.45);z-index:95;display:flex;align-items:center;justify-content:center;padding:22px;opacity:0;transition:opacity .2s;backdrop-filter:blur(2px)}
.modal-back.show{opacity:1}
.modal{background:var(--card);border-radius:22px;padding:22px;max-width:420px;width:100%;box-shadow:var(--sh-pop);transform:scale(.94);transition:transform .2s;max-height:84vh;overflow-y:auto}
.modal-back.show .modal{transform:scale(1)}
.modal h3{font-size:18px;margin-bottom:8px}
.toast-root{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media(min-width:960px){.toast-root{bottom:26px;left:auto;right:26px;align-items:flex-end}}
.toast{pointer-events:auto;background:var(--forest-2);color:#fff;border-radius:14px;padding:12px 16px;font-size:13.5px;font-weight:700;box-shadow:var(--sh-pop);display:flex;align-items:center;gap:9px;max-width:440px;animation:toastin .25s cubic-bezier(.2,.9,.3,1.2)}
.toast.ok{background:var(--ok)}
.toast.err{background:var(--err)}
.toast.warn{background:#B97F24}
.toast .ic{width:18px;height:18px;flex:none}
@keyframes toastin{from{opacity:0;transform:translateY(14px) scale(.96)}}
.toast.out{opacity:0;transform:translateY(8px);transition:.25s}

/* ---------- Skeleton / empty ---------- */
.skel{background:linear-gradient(100deg,var(--line-2) 40%,#F6F8F4 50%,var(--line-2) 60%);background-size:200% 100%;animation:sk 1.1s linear infinite;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
.skel-card{height:120px;border-radius:var(--r-lg)}
.empty{text-align:center;padding:44px 20px;color:var(--mut)}
.empty .ei{width:76px;height:76px;border-radius:26px;background:var(--pale);color:var(--sage);display:flex;align-items:center;justify-content:center;margin:0 auto 16px}
.empty .ei .ic{width:34px;height:34px}
.empty b{display:block;font-size:16px;color:var(--text);margin-bottom:5px}
.empty p{font-size:13.5px;max-width:280px;margin:0 auto 18px}

/* ---------- Status / timeline ---------- */
.statuschip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;padding:6px 12px;border-radius:99px}
.st-requested{background:var(--warn-bg);color:#A9741F}
.st-accepted{background:var(--ok-bg);color:var(--ok)}
.st-inprogress{background:#E3ECFB;color:#2C5BB8}
.st-completion{background:#F3E8FB;color:#7A3EA1}
.st-completed{background:var(--pale);color:var(--forest)}
.st-rejected{background:var(--err-bg);color:var(--err)}
.st-cancelled{background:var(--line-2);color:var(--mut)}
.st-issue{background:var(--err-bg);color:var(--err)}
.st-proposed{background:#FDF3E3;color:#A9741F}
.timeline{position:relative;padding-left:4px}
.tl-item{display:flex;gap:14px;position:relative;padding-bottom:20px}
.tl-item:last-child{padding-bottom:2px}
.tl-item::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl-item:last-child::before{display:none}
.tl-item.done::before{background:var(--sage)}
.tl-dot{width:28px;height:28px;border-radius:99px;background:var(--card);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--mut-2);z-index:1}
.tl-item.done .tl-dot{background:var(--forest);border-color:var(--forest);color:#fff}
.tl-item.now .tl-dot{border-color:var(--sage);color:var(--forest);background:var(--pale);box-shadow:0 0 0 4px rgba(110,156,136,.18)}
.tl-dot .ic{width:14px;height:14px}
.tl-item b{font-size:14px;display:block}
.tl-item .tl-t{font-size:12px;color:var(--mut)}

/* ---------- Price breakdown ---------- */
.pricebox{background:var(--pale-2);border:1.5px dashed var(--sage);border-radius:var(--r-md);padding:14px 16px}
.pricebox .prow{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;color:var(--mut);font-weight:600}
.pricebox .prow.free b{color:var(--ok)}
.pricebox .prow.tot{border-top:1.5px dashed var(--sage);margin-top:7px;padding-top:11px;color:var(--text);font-weight:800;font-size:15.5px}
.pricebox .prow.tot b{color:var(--forest);font-size:18px}
.zerofee{display:inline-flex;align-items:center;gap:4px;color:var(--ok);font-weight:800}

/* ---------- Chat ---------- */
.chat-wrap{display:flex;flex-direction:column;height:100%}
.chat-head{position:sticky;top:0;z-index:40;background:rgba(247,246,241,.92);backdrop-filter:blur(10px);display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--line-2)}
.chat-scroll{flex:1;overflow-y:auto;padding:16px 16px 10px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:78%;display:flex;flex-direction:column;gap:3px}
.msg .bub{padding:10px 14px;border-radius:18px;font-size:14px;line-height:1.45;word-break:break-word}
.msg .bub img{border-radius:12px;max-width:220px;max-height:220px;object-fit:cover;cursor:pointer;margin:2px 0}
.msg .tm{font-size:10.5px;color:var(--mut-2);padding:0 4px;display:flex;gap:4px;align-items:center}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--forest);color:#fff;border-bottom-right-radius:6px}
.msg.them{align-self:flex-start}
.msg.them .bub{background:var(--card);border:1px solid var(--line-2);border-bottom-left-radius:6px}
.chat-inputbar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(78px + env(safe-area-inset-bottom))}
.chat-inputbar .box{display:flex;gap:8px;align-items:flex-end;background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:7px 7px 7px 6px}
.chat-inputbar textarea{flex:1;border:none;outline:none;resize:none;max-height:110px;background:none;padding:9px 4px;font-size:14.5px}
.chat-inputbar .send{width:44px;height:44px;border-radius:13px;background:var(--forest);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;transition:.15s}
.chat-inputbar .send:disabled{opacity:.4}
.chat-inputbar .att{width:42px;height:42px;display:flex;align-items:center;justify-content:center;color:var(--mut);flex:none}
@media(min-width:960px){.chat-inputbar{padding-bottom:10px}.chat-scroll{padding-bottom:16px}}
.thread-row{display:flex;gap:12px;align-items:center;width:100%;padding:13px 4px;border-bottom:1px solid var(--line-2);text-align:left}
.thread-row:hover{background:var(--pale-2)}
.thread-row .tt{flex:1;min-width:0}
.thread-row .tt .l1{display:flex;justify-content:space-between;gap:8px}
.thread-row .tt b{font-size:14.5px}
.thread-row .tt .l2{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--mut)}
.thread-row .tt .l2 p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.unread{min-width:19px;height:19px;border-radius:99px;background:var(--ok);color:#fff;font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 5px;flex:none}

/* ---------- Portfolio / photos ---------- */
.pf-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pf-item{position:relative;border-radius:14px;overflow:hidden;aspect-ratio:1;cursor:pointer;border:1px solid var(--line-2)}
.pf-item img{width:100%;height:100%;object-fit:cover;transition:.25s}
.pf-item:hover img{transform:scale(1.04)}
.pf-item .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:10px;font-weight:700;color:#fff;background:linear-gradient(transparent,rgba(10,30,24,.72))}
.pf-add{aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;color:var(--mut);font-size:11.5px;font-weight:700;min-height:0}
.lightbox{position:fixed;inset:0;background:rgba(8,20,16,.9);z-index:200;display:none;align-items:center;justify-content:center;padding:24px}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:82vh;border-radius:14px;box-shadow:var(--sh-pop)}
.lightbox .lb-x{position:absolute;top:18px;right:18px;width:44px;height:44px;border-radius:99px;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center}

/* ---------- OTP ---------- */
.otpboxes{display:flex;gap:9px;justify-content:center}
.otpboxes input{width:48px;height:58px;text-align:center;font-size:23px;font-weight:800;border:1.5px solid var(--line);border-radius:14px;background:var(--card);transition:.15s}
.otpboxes input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3.5px rgba(110,156,136,.16);transform:translateY(-1px)}
.otpboxes input.filled{border-color:var(--forest);background:var(--pale-2)}
.otpboxes input.shake{animation:shake .4s;border-color:var(--err)}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.otpreveal{background:var(--pale-2);border:1.5px dashed var(--sage);border-radius:var(--r-md);padding:14px;text-align:center}
.otpreveal .code{font-size:31px;font-weight:800;letter-spacing:.34em;color:var(--forest);margin:6px 0 2px;font-variant-numeric:tabular-nums}
.otpreveal .tiny{letter-spacing:0}

/* ---------- Signature ---------- */
.sigwrap{background:var(--card);border:2px dashed var(--sage);border-radius:var(--r-lg);position:relative;overflow:hidden}
.sigwrap canvas{display:block;width:100%;height:220px;touch-action:none;cursor:crosshair}
.sigwrap .sig-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut-2);font-size:13px;font-weight:700;pointer-events:none;gap:8px}
.sig-actions{display:flex;gap:10px;margin-top:12px}
.sig-preview img{max-height:120px;border-radius:12px;border:1px solid var(--line-2);background:#fff}

/* ---------- Stars input ---------- */
.starin{display:flex;gap:6px;justify-content:center}
.starin button{color:var(--line);transition:.12s;padding:4px}
.starin button .ic{width:38px;height:38px;fill:currentColor;stroke:none}
.starin button.on{color:var(--warn);transform:scale(1.08)}
.ratingdist{display:flex;flex-direction:column;gap:6px}
.rd-row{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mut);font-weight:700}
.rd-row .bar{flex:1;height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.rd-row .bar i{display:block;height:100%;background:var(--warn);border-radius:99px}
.rd-row .v{width:34px;text-align:right}

/* ---------- Review card ---------- */
.review{padding:14px 0;border-bottom:1px solid var(--line-2)}
.review:last-child{border-bottom:none}
.review .rh{display:flex;gap:11px;align-items:center;margin-bottom:8px}
.review .rb{font-size:13.5px;color:#3D4A45}
.review .rf{display:flex;gap:8px;margin-top:8px}
.review .rf img{width:54px;height:54px;border-radius:10px;object-fit:cover;cursor:pointer;border:1px solid var(--line-2)}

/* ---------- Notifications ---------- */
.notif-row{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid var(--line-2);width:100%;text-align:left;align-items:flex-start}
.notif-row:hover{background:var(--pale-2)}
.notif-row .ni{width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--pale);color:var(--forest)}
.notif-row .ni .ic{width:19px;height:19px}
.notif-row b{font-size:13.5px;display:block}
.notif-row p{font-size:12.5px;color:var(--mut)}
.notif-row.unread b::after{content:"";display:inline-block;width:7px;height:7px;background:var(--err);border-radius:99px;margin-left:6px;vertical-align:2px}

/* ---------- Demo FAB & panel ---------- */
.demo-fab{position:fixed;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:70;background:var(--forest);color:#fff;border-radius:99px;padding:11px 16px;font-size:12.5px;font-weight:800;display:flex;align-items:center;gap:7px;box-shadow:var(--sh-pop);letter-spacing:.02em}
.demo-fab .ic{width:16px;height:16px}
.demo-fab:hover{background:var(--forest-soft)}
@media(min-width:960px){.demo-fab{bottom:22px;right:calc(248px + 28px)}}
.demo-row{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border-radius:14px;border:1.5px solid var(--line-2);margin-bottom:9px;text-align:left;background:var(--card);transition:.15s}
.demo-row:hover{border-color:var(--sage);background:var(--pale-2)}
.demo-row .di{width:38px;height:38px;border-radius:12px;background:var(--pale);color:var(--forest);display:flex;align-items:center;justify-content:center;flex:none}
.demo-row b{font-size:13.5px;display:block}
.demo-row span{font-size:11.5px;color:var(--mut);display:block}

/* ---------- Booking cards / detail ---------- */
.bk-card{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:15px;display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:.15s}
.bk-card:hover{box-shadow:var(--sh-sm);border-color:#DCE4DA}
.bk-card .top{display:flex;gap:12px;align-items:center}
.bk-card .info{flex:1;min-width:0}
.bk-card .info b{font-size:15px;display:block}
.bk-card .info span{font-size:12.5px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bk-card .foot{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line-2);padding-top:10px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;font-size:13.5px;border-bottom:1px dashed var(--line-2)}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--mut);font-weight:600;flex:none}
.kv .v{font-weight:700;text-align:right;min-width:0;overflow-wrap:anywhere}
.banner{display:flex;gap:11px;padding:13px 15px;border-radius:var(--r-md);font-size:13px;font-weight:600;align-items:flex-start}
.banner .ic{width:19px;height:19px;flex:none;margin-top:1px}
.banner.info{background:#EAF2EE;color:var(--forest)}
.banner.warn{background:var(--warn-bg);color:#8A5D14}
.banner.err{background:var(--err-bg);color:#A0322E}
.banner.ok{background:var(--ok-bg);color:#186B41}
.banner.purple{background:#F3E8FB;color:#6C3395}
.banner b{font-weight:800}
.banner .act{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.banner .act .btn{min-height:38px;padding:7px 14px;font-size:12.5px}
.detail-grid{display:grid;gap:14px}
@media(min-width:960px){.detail-grid{grid-template-columns:1.25fr .85fr;align-items:start}}
.pgsteps{display:flex;gap:6px;margin:14px 0 18px}
.pgsteps i{flex:1;height:5px;border-radius:99px;background:var(--line)}
.pgsteps i.on{background:var(--forest)}
.pgsteps i.cur{background:var(--sage)}
.slotgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.slot{border:1.5px solid var(--line);border-radius:13px;padding:11px 8px;text-align:center;font-weight:700;font-size:13px;background:var(--card);transition:.15s;min-height:48px}
.slot small{display:block;color:var(--mut);font-weight:600;font-size:10.5px}
.slot.on{border-color:var(--forest);background:var(--forest);color:#fff}
.slot.on small{color:#CFE0D8}
.daychip{min-width:64px;padding:9px 6px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);text-align:center;font-weight:800;font-size:12px;transition:.15s}
.daychip small{display:block;font-size:10px;color:var(--mut);font-weight:700;margin-bottom:2px}
.daychip.on{border-color:var(--forest);background:var(--forest);color:#fff}
.daychip.on small{color:#CFE0D8}
.imgpick{display:flex;gap:9px;flex-wrap:wrap}
.imgpick .ip{position:relative;width:74px;height:74px;border-radius:13px;overflow:hidden;border:1px solid var(--line-2)}
.imgpick .ip img{width:100%;height:100%;object-fit:cover}
.imgpick .ip button{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:99px;background:rgba(15,40,33,.72);color:#fff;display:flex;align-items:center;justify-content:center}
.imgpick .ip button .ic{width:12px;height:12px}
.imgpick .add{width:74px;height:74px;border-radius:13px;border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mut);font-size:10px;font-weight:700}

/* ---------- Auth ---------- */
.auth-wrap{min-height:100vh;display:flex;flex-direction:column}
.auth-hero{background:linear-gradient(160deg,var(--forest) 0%,var(--forest-2) 70%,#0C2C24 100%);color:#fff;padding:34px 24px 60px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.auth-hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:99px;background:radial-gradient(circle,rgba(110,156,136,.4),transparent 66%)}
.auth-body{padding:26px 22px 40px;max-width:480px;width:100%;margin:0 auto;flex:1}
.langseg{display:inline-flex;background:rgba(255,255,255,.14);border-radius:99px;padding:4px;gap:2px}
.langseg button{color:#D8E6DF;font-weight:800;font-size:12.5px;padding:7px 15px;border-radius:99px;min-height:34px}
.langseg button.on{background:#fff;color:var(--forest)}
.langseg.light{background:var(--pale)}
.langseg.light button{color:var(--mut)}
.langseg.light button.on{background:var(--forest);color:#fff}
.featlist{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.featlist .fl{display:flex;gap:11px;align-items:center;font-size:13.5px;font-weight:700;color:#E5EEE9}
.featlist .fl .ic{width:19px;height:19px;color:var(--sage-2)}
.auth-body .featlist .fl{color:var(--text)}
.auth-body .featlist .fl .ic{color:var(--sage)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:14px}
.stat .sv{font-size:21px;font-weight:800;color:var(--forest);letter-spacing:-.02em}
.stat .sl{font-size:11.5px;color:var(--mut);font-weight:700;margin-top:2px}
.stat.hl{background:var(--forest);border-color:var(--forest)}
.stat.hl .sv{color:#fff}
.stat.hl .sl{color:#AFC9BF}
@media(min-width:640px){.statgrid{grid-template-columns:repeat(4,1fr)}}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.qa{background:var(--card);border:1px solid var(--line-2);border-radius:15px;padding:12px 4px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:10.5px;font-weight:700;color:var(--text);text-align:center;min-height:76px;justify-content:center;transition:.15s}
.qa:hover{border-color:var(--sage)}
.qa .ic{width:21px;height:21px;color:var(--forest)}
.onlineswitch{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:14px 16px}
.onlineswitch .ot{flex:1}
.onlineswitch b{font-size:15px;display:flex;align-items:center;gap:7px}
.onlineswitch small{font-size:12px;color:var(--mut)}
.onlineswitch .pulse{width:9px;height:9px;border-radius:99px;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px rgba(35,134,83,.18)}}
.moneybig{font-size:30px;font-weight:800;color:var(--forest);letter-spacing:-.03em}
.distrib-bars{display:flex;align-items:flex-end;gap:7px;height:110px;padding:4px 0}
.distrib-bars .db{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--mut);font-weight:700}
.distrib-bars .db i{width:100%;border-radius:8px 8px 4px 4px;background:var(--sage);min-height:4px;display:block}
.distrib-bars .db.hot i{background:var(--forest)}
.tabs{display:flex;gap:6px;background:var(--pale-2);padding:4px;border-radius:13px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1;white-space:nowrap;font-weight:800;font-size:12.5px;color:var(--mut);padding:9px 12px;border-radius:10px;min-height:38px}
.tabs button.on{background:var(--card);color:var(--forest);box-shadow:var(--sh-sm)}
.req-photo-strip{display:flex;gap:7px}
.req-photo-strip img{width:52px;height:52px;border-radius:11px;object-fit:cover;cursor:pointer;border:1px solid var(--line-2)}
.filtergrid{display:flex;flex-direction:column;gap:16px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-weight:700;font-size:12.5px;color:var(--text);min-height:38px}
.seg button.on{background:var(--forest);border-color:var(--forest);color:#fff}
.rangebox{display:flex;align-items:center;gap:10px}
.rangebox input[type=range]{flex:1;accent-color:var(--forest)}
.linklike{background:none;color:var(--forest);font-weight:800;font-size:13.5px;min-height:40px}
.centerbar{text-align:center;padding:14px 0 4px}
.spin{width:22px;height:22px;border-radius:99px;border:3px solid var(--line);border-top-color:var(--forest);animation:spin .8s linear infinite;display:inline-block;vertical-align:-5px}
@keyframes spin{to{transform:rotate(360deg)}}
.loadingbar{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--mut);font-size:13px;font-weight:700;padding:22px 0}
.fadepage{animation:fp .22s ease}
@keyframes fp{from{opacity:0;transform:translateY(6px)}}
.success-anim{text-align:center;padding:38px 20px}
.success-anim .si{width:88px;height:88px;border-radius:99px;background:var(--ok-bg);color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 18px;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.success-anim .si .ic{width:42px;height:42px}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* ---- worker app specific ---- */
.wlogin-hero{background:linear-gradient(160deg,var(--forest) 0%,var(--forest-2) 70%,#0C2C24 100%);color:#fff;padding:30px 24px 54px;border-radius:0 0 30px 30px;position:relative;overflow:hidden;text-align:center}
.wlogin-hero::after{content:"";position:absolute;left:-60px;top:-70px;width:230px;height:230px;border-radius:99px;background:radial-gradient(circle,rgba(110,156,136,.35),transparent 66%)}
.demowcard{display:flex;gap:13px;align-items:center;background:var(--card);border:1.5px solid var(--sage);border-radius:var(--r-lg);padding:14px;width:100%;text-align:left;transition:.15s}
.demowcard:hover{background:var(--pale-2)}
.demowcard .dt{flex:1;min-width:0}
.demowcard b{font-size:15.5px;display:flex;align-items:center;gap:6px}
.demowcard span{font-size:12.5px;color:var(--mut)}
.dash-head{background:linear-gradient(150deg,var(--forest) 0%,var(--forest-2) 85%);color:#fff;padding:16px 20px 54px;margin:0 -16px 0;position:relative;overflow:hidden;border-radius:0 0 26px 26px}
.dash-head::after{content:"";position:absolute;right:-60px;top:-80px;width:220px;height:220px;border-radius:99px;background:radial-gradient(circle,rgba(110,156,136,.32),transparent 68%)}
.dash-float{margin-top:-36px;position:relative;z-index:2}
.greetrow{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2}
.greetrow .gl small{display:block;font-size:11.5px;color:#AFC9BF;font-weight:700}
.greetrow .gl b{font-size:18px}
.req-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
.req-actions .btn{min-height:46px}
.svc-edit-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line-2)}
.svc-edit-row:last-child{border-bottom:none}
.svc-edit-row .se-t{flex:1;min-width:0}
.svc-edit-row .se-t b{font-size:14px;display:block}
.svc-edit-row .se-t span{font-size:11.5px;color:var(--mut)}
.price-in{width:96px;flex:none;text-align:right;font-weight:800;padding:9px 12px;min-height:42px;border:1.5px solid var(--line);border-radius:11px}
.price-in:focus{outline:none;border-color:var(--sage)}
.otpmini{display:flex;gap:7px;justify-content:center;margin:14px 0 4px}
.otpmini input{width:44px;height:52px;text-align:center;font-size:21px;font-weight:800;border:1.5px solid var(--line);border-radius:12px}
.otpmini input:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(110,156,136,.16)}
.earn-hero{background:linear-gradient(150deg,var(--forest),var(--forest-2));border-radius:var(--r-xl);color:#fff;padding:20px;position:relative;overflow:hidden}
.earn-hero::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:99px;background:radial-gradient(circle,rgba(110,156,136,.3),transparent 70%)}
.earn-hero .moneybig{color:#fff}
.earn-hero .tiny{color:#AFC9BF}
.wprofile-head{display:flex;flex-direction:column;align-items:center;text-align:center;padding:22px 16px 4px}
.pf-big{background:var(--pale);border-radius:99px;width:92px;height:92px;display:flex;align-items:center;justify-content:center;color:var(--forest);margin-bottom:12px}
.pf-big .ic{width:40px;height:40px}
.catpick{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.catpick button{border:1.5px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;background:var(--card);text-align:left;min-height:52px}
.catpick button.on{border-color:var(--forest);background:var(--pale);color:var(--forest)}
.catpick .ci{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.catpick .ci .ic{width:17px;height:17px}

function fmtDate(val){const d=typeof val==='string'?new Date(val+'T00:00:00'):new Date(val);return d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});}
function fmtDayShort(dstr){const d=new Date(dstr+'T00:00:00'),today=new Date();today.setHours(0,0,0,0);const diff=Math.round((d-today)/864e5);
 if(diff===0)return t('today');if(diff===1)return t('tomorrow');if(diff===-1)return t('yest');
 return d.toLocaleDateString(curLocale(),{weekday:'short',day:'numeric',month:'short'});}
function timeAgo(ts){const s=Math.floor((Date.now()-ts)/1000);if(s<60)return t('justnow');if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<7*86400)return Math.floor(s/86400)+'d';return fmtDate(ts);}
function initials(name){return name.split(/\s+/).slice(0,2).map(p=>p[0]).join('').toUpperCase();}

/* ---------- data helpers ---------- */
function wById(id){return S.workers.find(w=>w.id===id);}
function bkById(id){return S.bookings.find(b=>b.id===id);}
function catById(id){return S.cats.find(c=>c.id===id)||S.cats[9];}
function catOfSvc(name){const c=CATALOG.find(x=>x.n===name);return c?catById(c.c):catById('other');}
function avg(w){return w.rat.cnt?w.rat.sum/w.rat.cnt:0;}
function wMinPrice(w){return w.services.reduce((m,s)=>Math.min(m,s.price),Infinity);}
function workerServices(w){return w.services.filter(s=>s.available!==false);}
function myNotifs(){return S.notifs[ROLE];}
function unreadNotifs(){return myNotifs().filter(n=>!n.read).length;}
function myChatUnread(){const me=ROLE==='customer'?'c':'w';let n=0;for(const k in S.chats){const th=S.chats[k];th.msgs.forEach(m=>{if(m.f!==me&&m.at>(th[me]||0))n++;});}return n;}
function getThread(key){if(!S.chats[key]){S.chats[key]={c:0,w:0,msgs:[]};}return S.chats[key];}
function threadPartnerName(key){if(key[0]==='b'){const b=bkById(key);if(!b)return '';const me=ROLE==='customer'?'c':'w';return me==='c'?wById(b.workerId).name:(b.custName||'Customer');}return ROLE==='customer'?wById(key.slice(2)).name:(S.sessionWorker?S.sessionWorker.name:'');}
function notify(role,k,p,ref,ic){S.notifs[role].unshift({id:'n'+Date.now()+Math.floor(Math.random()*999),k,p:p||{},ref:ref||'',at:Date.now(),read:false,ic:ic||'bell'});}
function pushMsg(key,from,text,img){const th=getThread(key);th.msgs.push({f:from,t:text,img:img||null,at:Date.now()});}
/* ---------- store & cross-tab sync ---------- */
let S=null,syncPaused=false;
function loadState(){try{const raw=localStorage.getItem(LSK);if(raw){S=JSON.parse(raw);}}catch(e){S=null;}
 if(!S||S.v!==1||!S.workers){S=seed();persist();}}
function persist(){try{S.seq=(S.seq||0)+1;S.updatedAt=Date.now();localStorage.setItem(LSK,JSON.stringify(S));}catch(e){toast(t('err_generic'),'err','alert');}}
let lastSeenUpdate=0,lastDigest=null;
function digest(){return JSON.stringify([S.updatedAt,myNotifs().length,myChatUnread()]);}
function pullRemote(){if(syncPaused)return;let raw=null;try{raw=localStorage.getItem(LSK);}catch(e){return;}
 if(!raw)return;let remote;try{remote=JSON.parse(raw);}catch(e){return;}
 if(!remote||!remote.updatedAt)return;
 const mySeq=S.seq||0;
 if((remote.seq||0)>mySeq||((remote.seq||0)===mySeq&&remote.updatedAt>S.updatedAt+400)){const was=S.updatedAt;S=remote;onRemoteChange(was);}}
function onRemoteChange(prevTs){const d=digest();if(d!==lastSeenUpdate){const newN=myNotifs().filter(n=>!n.read&&n.at>prevTs);renderNav();
 const ae=document.activeElement;const typing=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
 if(!typing)renderRoute();
 if(newN.length&&(S.prefs?S.prefs[ROLE==='customer'?'notifC':'notifW']!==false:true))toast(esc(t(newN[0].k,newN[0].p)),'info','bell');lastSeenUpdate=d;}}
setInterval(pullRemote,1300);
window.addEventListener('storage',e=>{if(e.key===LSK)pullRemote();});
/* ---------- router ---------- */
const stack=[];const SCREENS={};
function go(name,params){stack.push({name,params:params||{}});renderRoute();}
function back(){if(stack.length>1){stack.pop();renderRoute();}else resetTo(NAV[0].id);}
function resetTo(name,params){stack.length=0;stack.push({name,params:params||{}});renderRoute();}
function curRoute(){return stack[stack.length-1]||{name:NAV[0].id,params:{}};}
function isTabActive(id){return curRoute().name===id||(id==='chats'&&(curRoute().name==='chat'||curRoute().name==='chats'));}
function renderRoute(){const r=curRoute();const sc=SCREENS[r.name];const view=$('#view');if(!sc)return;
 view.className='view '+(sc.cls||'');view.innerHTML='<div class="fadepage">'+sc.html(r.params)+'</div>';
 window.scrollTo(0,0);renderNav();if(sc.after)sc.after(r.params);lastSeenUpdate=digest();}

/* ---------- images ---------- */
function downscale(file,max){max=max||900;return new Promise(res=>{const fr=new FileReader();
 fr.onerror=()=>res(null);
 fr.onload=()=>{const img=new Image();
  img.onload=()=>{let w=img.width,h=img.height;if(!w||!h){res(null);return;}
   const sc=Math.min(1,max/Math.max(w,h));w=Math.round(w*sc);h=Math.round(h*sc);
   const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
   res(c.toDataURL('image/jpeg',.72));};
  img.onerror=()=>res(null);img.src=fr.result;};
 fr.readAsDataURL(file);});}
function pickImages(max,cb){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.multiple=max>1;
 inp.style.position='fixed';inp.style.left='-9999px';document.body.appendChild(inp);
 inp.onchange=async()=>{const out=[];let tooBig=false;

function otpBoxesHtml(){let h='<div class="otpboxes" id="otpBoxes">';for(let i=0;i<6;i++)h+='<input inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="OTP digit '+(i+1)+'">';return h+'</div>';}
function bindOtpBoxes(rootEl,onDone){const boxes=[...rootEl.querySelectorAll('input')];
 boxes.forEach((b,i)=>{b.addEventListener('input',()=>{b.value=b.value.replace(/\D/g,'').slice(0,1);b.classList.toggle('filled',!!b.value);
  if(b.value&&i<5)boxes[i+1].focus();if(boxes.every(x=>x.value))onDone(boxes.map(x=>x.value).join(''));});
  b.addEventListener('keydown',e=>{if(e.key==='Backspace'&&!b.value&&i>0)boxes[i-1].focus();});
  b.addEventListener('paste',e=>{e.preventDefault();const v=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);
   v.split('').forEach((c,j)=>{if(boxes[j]){boxes[j].value=c;boxes[j].classList.add('filled');}});if(v.length===6)onDone(v);});});
 return {focus:()=>boxes[0].focus(),clear:()=>boxes.forEach(x=>{x.value='';x.classList.remove('filled');}),shake:()=>boxes.forEach(x=>{x.classList.add('shake');setTimeout(()=>x.classList.remove('shake'),450);})};}

function wEarnings(){const mbs=myBookings();const done=mbs.filter(b=>b.status==='completed');
 const now=new Date();const today=new Date();today.setHours(0,0,0,0);
 const total=done.reduce((a,b)=>a+b.price,0);
 const month=done.filter(b=>{const s=b.timeline.find(x=>x.k==='signed');return s&&new Date(s.at).getMonth()===now.getMonth()&&new Date(s.at).getFullYear()===now.getFullYear();}).reduce((a,b)=>a+b.price,0);
 const td=done.filter(b=>{const s=b.timeline.find(x=>x.k==='signed');return s&&new Date(s.at)>=today;}).reduce((a,b)=>a+b.price,0);
 const pending=mbs.filter(b=>b.status==='completion');
 return {total,month,today:td,pending,done};}

ACTIONS.wLogout=()=>{confirmDlg({title:t('wp_logout_q'),body:t('pf_logout_b'),ok:t('wp_logout_l'),danger:true}).then(y=>{if(!y)return;S.sessionWorker=null;persist();resetTo('wlogin');});};
ACTIONS.resetData=()=>{confirmDlg({title:t('pf_reset_q'),body:t('pf_reset_b'),ok:t('pf_reset'),danger:true}).then(y=>{if(!y)return;try{localStorage.removeItem(LSK);}catch(e){}location.reload();});};
ACTIONS.togDemo=(d,el)=>{S.demo[ROLE]=!S.demo[ROLE];persist();el.classList.toggle('on',S.demo[ROLE]);};
/* ---------- chats (worker side) ---------- */
function workerThreads(){const me=sw();if(!me)return [];
 return Object.keys(S.chats).filter(k=>{const th=S.chats[k];if(!th.msgs.length)return false;
  if(k[0]==='b'){const b=bkById(k);return b&&b.workerId===me.id;}
  return k==='w_'+me.id;});}
SCREENS.chats={html(){const keys=workerThreads().sort((a,b)=>(S.chats[b].msgs[S.chats[b].msgs.length-1]||{at:0}).at-(S.chats[a].msgs[S.chats[a].msgs.length-1]||{at:0}).at);
 return wPageHead(esc(t('ch_t')))+(keys.length?'<div class="card" style="padding:0 15px">'+keys.map(k=>{const th=S.chats[k];const last=th.msgs[th.msgs.length-1];
  const un=th.msgs.filter(m=>m.f!=='w'&&m.at>(th.w||0)).length;
  const name=k[0]==='b'?(bkById(k).custName||'Customer'):S.customer.name;
  return '<button class="thread-row" data-act="openChat" data-key="'+k+'">'+custAvatar(name)+
  '<span class="tt"><span class="l1"><b>'+esc(name)+'</b><span class="tiny">'+timeAgo(last.at)+'</span></span>'+
  '<span class="l2"><p>'+esc((last.t||'').slice(0,42))+(last.img?' \u{1F4F7}':'')+'</p>'+(un?'<span class="unread">'+un+'</span>':'')+'</span></span></button>';}).join('')+'</div>'
 :'<div class="empty"><div class="ei">'+I('chat')+'</div><b>'+esc(t('ch_empty_t'))+'</b><p>'+esc(t('ch_empty_b'))+'</p></div>');},after(){}};
ACTIONS.openChat=d=>go('chat',{key:d.key});
SCREENS.chat={cls:'flush',html(p){const key=p.key;const th=getThread(key);
 const b=key[0]==='b'?bkById(key):null;const name=b?(b.custName||'Customer'):S.customer.name;
 const ctx=b?t('ch_ctx',{svc:b.svc,date:fmtDayShort(b.date)}):t('ch_general');
 setTimeout(()=>{th.w=Date.now();persist();},300);
 return '<div class="chat-head"><button class="iconbtn plain" data-act="backA" aria-label="'+esc(t('back'))+'">'+I('back')+'</button>'+
 custAvatar(name)+'<div style="flex:1;min-width:0"><b style="font-size:15px;display:block">'+esc(name)+'</b>'+
 '<span class="tiny" style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">'+esc(ctx)+'</span></div>'+
 (b?'<button class="btn soft xs" data-act="openJob" data-id="'+b.id+'">'+esc(t('view'))+'</button>':'')+'</div>'+
 '<div class="chat-scroll" id="chatScroll"><div style="text-align:center;margin-bottom:6px"><span class="simtag">'+esc(t('ch_sim'))+'</span></div>'+
 th.msgs.map(m=>{const mine=m.f==='w';
  return '<div class="msg '+(mine?'me':'them')+'"><div class="bub">'+(m.img?'<img src="'+m.img+'" data-act="lb" data-src="'+m.img+'" alt="">':'')+(m.t?'<div>'+esc(m.t)+'</div>':'')+'</div>'+
  '<span class="tm">'+fmtTime(m.at)+(mine?' '+I('checkc','xs'):'')+'</span></div>';}).join('')+'</div>'+
 '<div class="chat-inputbar"><div class="box"><button class="att" data-act="chatAttach" aria-label="'+esc(t('comp_add'))+'">'+I('clip')+'</button>'+
 '<textarea id="chatInp" rows="1" placeholder="'+esc(t('ch_ph'))+'"></textarea>'+
 '<button class="send" id="chatSend" data-act="chatSend" data-key="'+key+'" aria-label="'+esc(t('send'))+'">'+I('send','sm')+'</button></div></div>';},
 after(p){const inp=$('#chatInp');const sc=$('#chatScroll');if(sc)sc.scrollTop=sc.scrollHeight;
 if(inp){inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(110,inp.scrollHeight)+'px';});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ACTIONS.chatSend({key:p.key});}});}}};
ACTIONS.chatSend=d=>{const inp=$('#chatInp');const v=(inp?inp.value:'').trim();if(!v)return;
 mockSendMessage(d.key,v);renderRoute();maybeSimReply(d.key);};
ACTIONS.chatAttach=d=>{const key=curRoute().params.key;pickImages(1,imgs=>{if(!imgs.length)return;mockSendMessage(key,'',imgs[0]);renderRoute();maybeSimReply(key);});};
function maybeSimReply(key){if(!S.demo[ROLE])return;setTimeout(()=>{const canned=CANNED[ROLE==='customer'?'w':'c'];
 pushMsg(key,ROLE==='customer'?'w':'c',canned[Math.floor(Math.random()*canned.length)]);persist();
 notify(ROLE,'notif.'+(ROLE==='customer'?'c':'w')+'.message',{name:threadPartnerName(key)},key,'chat');
 if(curRoute().name==='chat'&&curRoute().params.key===key)renderRoute();else renderNav();
 toast(esc(t('ch_new',{name:threadPartnerName(key)})),'info','chat');},2100);}
/* ---------- demo sheet ---------- */
function openDemoSheet(){const rows=[];const mbs=myBookings();
 mbs.filter(b=>b.status==='requested').slice(0,2).forEach(b=>rows.push('<button class="demo-row" data-act="jobAccept" data-id="'+b.id+'"><span class="di">'+I('check')+'</span><span><b>'+esc(t('acc'))+'</b><span>'+esc(b.custName)+' \u2022 '+esc(b.svc)+'</span></span></button>'));
 mbs.filter(b=>b.status==='proposed'&&b.proposal.status==='pending').slice(0,2).forEach(b=>rows.push('<button class="demo-row" data-act="demoCAcceptPrice" data-id="'+b.id+'"><span class="di">'+I('tag')+'</span><span><b>'+esc(t('demo_approve'))+'</b><span>'+esc(b.custName)+'</span></span></button>'));
 mbs.filter(b=>b.status==='accepted').slice(0,2).forEach(b=>rows.push('<button class="demo-row" data-act="demoShowOtp" data-id="'+b.id+'"><span class="di">'+I('key')+'</span><span><b>'+esc(t('demo_showotp'))+'</b><span>'+esc(b.svc)+'</span></span></button>'));
 mbs.filter(b=>b.status==='completion').slice(0,2).forEach(b=>rows.push('<button class="demo-row" data-act="demoCSign" data-id="'+b.id+'"><span class="di">'+I('edit')+'</span><span><b>'+esc(t('demo_sign'))+'</b><span>'+esc(b.custName)+'</span></span></button>'));
 rows.push('<button class="demo-row" data-act="demoNewReq"><span class="di">'+I('inbox')+'</span><span><b>'+esc(t('demo_newreq'))+'</b><span>'+esc(t('demo_note'))+'</span></span></button>');
 openSheet('<div class="sec-h"><h3>'+esc(t('demo_t'))+'</h3><span class="badge demo">'+esc(t('demo_badge'))+'</span></div><p class="sh-sub">'+esc(t('demo_s'))+'</p>'+rows.join('')+
 '<div class="togglerow" style="border-top:1px solid var(--line-2);margin-top:6px"><span><span class="tl">'+esc(t('pf_demo'))+'</span><br><span class="ts">'+esc(t('pf_demo_s'))+'</span></span><button class="toggle'+(S.demo.worker?' on':'')+'" data-act="togDemo" role="switch" aria-checked="'+S.demo.worker+'"></button></div>'+
 '<p class="tiny">'+esc(t('demo_note'))+'</p>');}
/* notif routing for worker */
ACTIONS.notifOpen=d=>{const n=myNotifs().find(x=>x.id===d.id);if(n)n.read=true;persist();closeSheet(true);
 if(d.ref&&bkById(d.ref)){go('job',{id:d.ref});return;}renderRoute();};
/* ---------- boot ---------- */
function workerBoot(){bootApp();
 if(!S.sessionWorker)resetTo('wlogin');else resetTo('dash');}
workerBoot();
</script>
